# Input for: odoo-synth profile create --dependencies-file examples/multi-repo/dependencies.yaml ...
#            odoo-synth profile update  <id> --dependencies-file examples/multi-repo/dependencies.yaml
#
# Shared infra declared by name + kind (never auto-provisioned, never
# assumed) -- the workspace boots these before any component that wires to
# them. `kind` doubles as the URL scheme discovery matches against a
# component's env values (e.g. BROKER_URL=redis://... -> kind: redis) when no
# name-prefix hint is present.
#
# A dependency can also opt into a Coder-dashboard app tile via `expose`,
# same shape/rules as a component's (see components.yaml) -- useful for a
# monitoring sidecar that genuinely runs as its own standalone container
# (nothing here needs that in this profile: prs-worker's own image already
# bundles Celery Flower internally, so it's exposed as part of the worker
# component instead -- see components.yaml).

- name: redis
  kind: redis
