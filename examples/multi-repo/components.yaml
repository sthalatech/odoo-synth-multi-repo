# Input for:
#   odoo-synth profile create --components-file examples/multi-repo/components.yaml \
#                              --dependencies-file examples/multi-repo/dependencies.yaml ...
#   odoo-synth profile update  <id> --components-file examples/multi-repo/components.yaml
#
# Real 5-repo setup validated during multi-repo design (odoo + 4 services).
# `port` is the platform's own assignment (used for peer wiring + the
# workspace's --network host binding) -- discovery only *proposes* one from a
# Dockerfile EXPOSE/--port as a hint, it never invents one for you.
#
# `env.from_repo` is left unset on every non-odoo component: discovery falls
# back to trying the common conventional names itself (.env.sample,
# .env.example, .env.template, env.sample, .env, .env.local, .env.development,
# .env.test) against each repo at its pinned ref. Set `env.from_repo`
# explicitly only if a repo's real file doesn't match any of those.
#
# `expose: {port: N}` opts a component into a Coder-dashboard app tile
# (subdomain-proxied through the authenticated tunnel, same as Odoo's own
# app -- never a public/inbound port). Deliberately separate from `port`
# above: a component can need its port purely for internal peer-wiring
# without wanting a dashboard tile (an internal-only API, a worker with no
# HTTP surface at all). Omit `expose` entirely to keep a component
# internal-only. Optional `expose.path` sets the tile's entry point when
# it isn't "/" -- e.g. a service whose real entry point is a docs page or
# an admin path rather than its bare root. None of the components below
# currently need it (their root path is what a developer actually wants).
#
# `expose.share` (owner/authenticated/public, default owner) controls how
# much of Coder's OWN tunnel auth gate applies. "owner" (the default) is
# right for a human opening a UI in their own logged-in browser -- wrong for
# a component that another exposed component's browser-side JS calls
# directly (e.g. admin-frontend's fetch() to facade): a CORS preflight never
# carries the Coder session cookie, so the gate 303-redirects it and the
# browser rejects a redirected preflight outright. facade below uses
# "public" so Coder's gate steps aside and facade's own system-token check
# is what actually protects it.

- name: odoo
  kind: odoo
  repo_url: https://github.com/IshaFoundationIT/prs-backend
  repo_ref: uat
  port: null
  odoo:
    odoo_series: "17.0"
    odoo_git_url: https://github.com/odoo/odoo
    odoo_git_ref: "17.0"
    needs_enterprise: true
    enterprise_source: https://github.com/odoo/enterprise.git

- name: facade
  kind: docker
  repo_url: https://github.com/IshaFoundationIT/prs-facade
  repo_ref: uat
  port: 8000
  expose:
    port: 8000
    share: public
  docker:
    dockerfile: Dockerfile

- name: worker
  kind: docker
  repo_url: https://github.com/IshaFoundationIT/prs-worker
  repo_ref: main
  # Not a pure background worker: its own start.sh runs celery worker + celery
  # beat + celery flower (--port=5555, --basic_auth) all in one container --
  # 5555 is its actual (and only) HTTP surface, so it's exposed here rather
  # than as a standalone dependency.
  port: 5555
  expose:
    port: 5555
  docker:
    dockerfile: Dockerfile

- name: frontend
  kind: process
  repo_url: https://github.com/IshaFoundationIT/prs-frontend
  repo_ref: dev
  port: 3000
  expose:
    port: 3000
  process:
    # Pins yarn@4.5.0 via its own package.json "packageManager" field --
    # the golden AMI has corepack enabled, which reads that and shims the
    # right yarn version. Do not assume npm: check each repo's actual
    # package.json/lockfile before wiring install/build commands.
    install_cmd: yarn install --immutable
    build_cmd: yarn build
    # `process` kind, not `static`: the repo's own package.json already
    # defines "preview": "vite preview --port 3003" -- Vite's preview
    # server correctly serves the production build (SPA-fallback, etc.),
    # which a generic static-file server (what `static` kind uses) does
    # not do on its own. Always prefer a component's own serve mechanism
    # over approximating one -- $PORT is exported by the boot script
    # before this runs, overriding the repo's own hardcoded --port.
    start_cmd: yarn vite preview --port $PORT --host 127.0.0.1 --strictPort

- name: admin-frontend
  kind: process
  repo_url: https://github.com/IshaFoundationIT/irs-admin-frontend
  repo_ref: dev
  port: 9000
  expose:
    port: 9000
  process:
    # Pins pnpm@10.30.1 via package.json's "packageManager" field, same
    # corepack mechanism as frontend's yarn above.
    install_cmd: pnpm install --frozen-lockfile
    build_cmd: pnpm run build
    start_cmd: pnpm run start
